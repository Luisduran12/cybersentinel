[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersentinel"
version = "0.1.0"
description = "Agente defensivo de ciberseguridad (blue team): analiza, predice y ayuda a contrarrestar amenazas con explicabilidad y gobernanza etica."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Luis Emir" }]
dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "pysigma>=1.5.0,<2.0",          # parser/AST Sigma
    "stix2>=3.0",                   # CTI: bundles STIX 2.1
    "langchain-core>=0.3",          # contrato de Document/Embeddings
    "langchain-community>=0.3",     # indice FAISS
    "langchain-text-splitters>=0.3",
    "faiss-cpu>=1.8",               # busqueda vectorial del RAG
    "fastapi>=0.115",               # API de ingestion
    "uvicorn[standard]>=0.30",      # servidor ASGI
    "httpx>=0.27",                  # cliente HTTP (generador de carga, pruebas)
    "psutil>=5.9",                  # CPU y RAM medidos en el banco de pruebas
    "python-dotenv>=1.0",           # Gestion de secretos
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "langchain-anthropic>=0.3"]
viz = ["matplotlib>=3.7"]              # curvas ROC y precision-exhaustividad
attack = ["mitreattack-python>=3.0"]   # solo para regenerar la cache de ATT&CK
dev = ["pytest>=7.0", "matplotlib>=3.7"]
cti = ["stix2>=3.0"]
rag = ["langchain-core>=0.1", "langchain-community>=0.0", "faiss-cpu>=1.7", "numpy>=1.24"]
streaming = ["nats-py>=2.6"]           # bus de mensajes (Fase 1: ver docs/PRODUCTION-ARCHITECTURE.md)

[project.scripts]
cybersentinel = "cybersentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# El panel SOC se sirve desde el propio proceso, asi que sus archivos tienen
# que viajar dentro del paquete instalado.
"cybersentinel.api" = ["panel/*.html", "panel/*.css", "panel/*.js"]

[tool.pytest.ini_options]
markers = [
    "asyncio: prueba de integración async contra infraestructura real (NATS); no corre en la suite estándar.",
]
