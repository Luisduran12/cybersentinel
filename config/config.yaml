# Configuracion general de CyberSentinel.
# La lee src/cybersentinel/config.py; los argumentos de la CLI tienen prioridad.

detection:
  # "auto" deja que Isolation Forest use su umbral estandar de decision.
  # Un numero (p.ej. 0.08) fuerza esa proporcion de anomalias por construccion,
  # haya ataques o no: util solo para experimentos controlados.
  anomaly_contamination: auto

  # Score minimo para convertir una anomalia en hallazgo.
  # Vacio (null) = usar el umbral sugerido por la linea base (percentil 99),
  # que se adapta a los datos en vez de ser una constante magica.
  anomaly_threshold: null

correlation:
  time_window_minutes: 30   # ventana para agrupar hallazgos en un incidente

prediction:
  # Modelo de secuencia entrenado para predecir la fase siguiente.
  # null = heuristica del orden canonico (comportamiento historico).
  # Se genera con:  cybersentinel train-prediction --save-model <ruta>
  model_path: models/markov_tactics.json
  top_k: 2

explanation:
  use_llm: false            # true = enriquecer con Claude (requiere API key)
  model: claude-opus-5
