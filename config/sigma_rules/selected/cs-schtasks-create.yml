title: Schtasks.exe Scheduled Task Creation (CyberSentinel Adaptation)
id: 1e5f7d2b-3a8c-4b6e-a9d1-c2f4e7b8dd34
status: test
description: >-
  Detects creation of a scheduled task via schtasks.exe with /create flag.
  A common persistence mechanism. Adapted from SigmaHQ proc_creation_win_schtasks_create.

  ADAPTATION NOTES:
  - Field 'CommandLine' maps to SecurityEvent.command_line via FIELD_MAP.
  - 'contains|all' ensures both substrings appear in the same command line.
  - Original rule is broader; this version requires both schtasks and /create
    to reduce false positives (same logic as CyberSentinel RULE-0003).

references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_schtasks_creation.yml
author: CyberSentinel adaptation (original SigmaHQ community)
date: 2026-09-14
logsource:
  product: cybersentinel
  category: process_creation
detection:
  selection:
    CommandLine|contains|all:
      - 'schtasks'
      - '/create'
  condition: selection
falsepositives:
  - Legitimate software installers registering update tasks.
  - System maintenance scripts scheduled by the ops team.
level: medium
tags:
  - attack.persistence
  - attack.t1053.005
