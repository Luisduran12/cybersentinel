title: Mshta.exe Execution - Defense Evasion (CyberSentinel Adaptation)
id: 5f8b2c9e-1d6a-4f3b-c7e2-a4b8d1f2ff56
status: test
description: >-
  Detects execution of mshta.exe, a LOLBin used to execute malicious HTA files
  and JavaScript/VBScript from URLs. Adapted from SigmaHQ proc_creation_win_mshta.

  ADAPTATION NOTES:
  - Field 'Image' maps to SecurityEvent.process_name via FIELD_MAP (basename only).
  - 'endswith: mshta.exe' works correctly for process_name (basename matches).
  - Original SigmaHQ rule additionally checks CommandLine patterns for URLs/scripts;
    this adaptation keeps only the Image check to avoid false negatives when
    CommandLine is not captured.

references:
  - https://attack.mitre.org/techniques/T1218/005/
  - https://lolbas-project.github.io/lolbas/Binaries/Mshta/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_mshta.yml
author: CyberSentinel adaptation (original SigmaHQ community)
date: 2026-09-14
logsource:
  product: cybersentinel
  category: process_creation
detection:
  selection:
    Image|endswith: 'mshta.exe'
  condition: selection
falsepositives:
  - Legacy enterprise applications that use HTA for user interfaces.
  - Developer testing of HTA-based tools.
level: high
tags:
  - attack.defense-evasion
  - attack.t1218.005
