title: PowerShell Encoded Command (CyberSentinel Adaptation)
id: 3d6d4b49-5f2e-4e29-9e37-a1b7f3e5aa01
status: test
description: >-
  Detects PowerShell execution with -EncodedCommand / -enc flags or common
  obfuscation switches (-nop, -w hidden, -noprofile). Adapted from SigmaHQ
  proc_creation_win_powershell_encode rule for CyberSentinel SecurityEvent schema.

  ADAPTATION NOTES:
  - Field 'CommandLine' maps to SecurityEvent.command_line via FIELD_MAP.
  - Logsource category 'process_creation' maps to event.category='process'.
  - Regex adapted from SigmaHQ original; semantics preserved.
  - Original SigmaHQ rule uses Windows Event Log fields (Sysmon EventID 1);
    this adaptation works with CyberSentinel normalized telemetry only.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_encode.yml
author: CyberSentinel adaptation (original SigmaHQ community)
date: 2026-09-14
logsource:
  product: cybersentinel
  category: process_creation
detection:
  selection:
    CommandLine|re: 'powershell(\.exe)?\b.*?(\s-enc\b|\s-e\b|-encodedcommand\b|-nop\b|-noprofile\b|-w\s+hidden\b|-windowstyle\s+hidden\b)'
  condition: selection
falsepositives:
  - Deployment scripts that legitimately use -NoProfile for performance.
  - Inventory tools invoking PowerShell with hidden window.
level: high
tags:
  - attack.execution
  - attack.t1059.001
