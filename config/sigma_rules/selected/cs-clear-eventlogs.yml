title: Windows Event Log Cleared (CyberSentinel Adaptation)
id: bb406241-9ebc-41aa-8d7f-2db95e34f27f
status: test
description: >-
  Detects wevtutil.exe clearing an event log, or the PowerShell equivalent
  Clear-EventLog / Clear-WinEvent — a common indicator-removal step used to
  hide prior activity from the very log an analyst would check first.

  ADAPTATION NOTES:
  - Field 'CommandLine' maps to SecurityEvent.command_line via FIELD_MAP.
  - Logsource category 'process_creation' maps to event.category='process'.
references:
  - https://attack.mitre.org/techniques/T1070/001/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_wevtutil_clear_logs.yml
author: CyberSentinel adaptation (original SigmaHQ community)
date: 2026-09-17
logsource:
  product: cybersentinel
  category: process_creation
detection:
  wevtutil:
    CommandLine|contains|all:
      - 'wevtutil'
      - 'cl'
  posh:
    CommandLine|contains:
      - 'clear-eventlog'
      - 'clear-winevent'
  condition: wevtutil or posh
falsepositives:
  - Legitimate log-rotation maintenance (rare and usually scheduled, not interactive).
level: high
tags:
  - attack.defense-evasion
  - attack.t1070.001
