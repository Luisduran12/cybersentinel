title: System Information Discovery via systeminfo.exe (CyberSentinel Adaptation)
id: e77d3a9b-b729-4a8b-9e46-a377a751f78e
status: test
description: >-
  Detects execution of systeminfo.exe, commonly used during reconnaissance
  to fingerprint OS version, patches and hardware before selecting an
  exploit or lateral-movement technique.

  ADAPTATION NOTES:
  - Field 'Image' maps to SecurityEvent.process_name (basename only).
  - Logsource category 'process_creation' maps to event.category='process'.
references:
  - https://attack.mitre.org/techniques/T1082/
author: CyberSentinel (native)
date: 2026-09-17
logsource:
  product: cybersentinel
  category: process_creation
detection:
  selection:
    Image|endswith: 'systeminfo.exe'
  condition: selection
falsepositives:
  - Routine inventory/asset-management scripts.
level: low
tags:
  - attack.discovery
  - attack.t1082
