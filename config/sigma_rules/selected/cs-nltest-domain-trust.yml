title: Domain Trust Discovery via Nltest (CyberSentinel Adaptation)
id: 5a5009f3-6437-4f39-bfb5-01f78415a547
status: test
description: >-
  Detects nltest.exe used with /domain_trusts or /dclist, common commands
  used by attackers (and red teams) to map Active Directory trust
  relationships ahead of lateral movement across domains.

  ADAPTATION NOTES:
  - Field 'CommandLine' maps to SecurityEvent.command_line via FIELD_MAP.
  - Logsource category 'process_creation' maps to event.category='process'.
references:
  - https://attack.mitre.org/techniques/T1482/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_nltest_trust_query.yml
author: CyberSentinel adaptation (original SigmaHQ community)
date: 2026-09-17
logsource:
  product: cybersentinel
  category: process_creation
detection:
  selection:
    CommandLine|contains: 'nltest'
  flags:
    CommandLine|contains:
      - '/domain_trusts'
      - '/dclist'
      - '/trusted_domains'
  condition: selection and flags
falsepositives:
  - Legitimate AD administration and health-check scripts.
level: medium
tags:
  - attack.discovery
  - attack.t1482
