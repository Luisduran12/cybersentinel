# ── Resumen de cobertura ────────────────────────────────────────────────────
coverage:
  tactics:
    - name: execution
      techniques: [T1059.001, T1047]
      rules: [cs-ps-encoded-cmd, cs-wmic-process]
    - name: discovery
      techniques: [T1033, T1087, T1046]
      rules: [cs-whoami-exec, cs-net-recon, cs-portscan-tool]
    - name: persistence
      techniques: [T1053.005]
      rules: [cs-schtasks-create]
    - name: defense-evasion
      techniques: [T1218.005, T1218.010, T1218.011]
      rules: [cs-mshta-exec, cs-regsvr32-exec, cs-rundll32-exec]
    - name: command-and-control
      techniques: [T1105, T1071]
      rules: [cs-certutil-download, cs-c2-port-connect]
    - name: exfiltration
      techniques: [T1048]
      rules: [cs-large-outbound]
    - name: lateral-movement
      techniques: [T1021.001]
      rules: [cs-rdp-lateral]
    - name: credential-access
      techniques: [T1110, T1110.003]
      rules: [cs-auth-failure, cs-auth-failure-external]

  not_covered_tactics:
    - initial-access
    - privilege-escalation
    - collection
    - impact
    - resource-development
  reason: >-
    Las tácticas no cubiertas requieren telemetría ausente en SecurityEvent:
    phishing (Initial Access → file metadata, email headers),
    token manipulation (Privilege Escalation → access token fields),
    clipboard/screen capture (Collection → OS API calls),
    disk wipe / encryption (Impact → file system events),
    resource-development (no telemetría interna disponible).
    Ver docs/SIGMA-EXCLUSIONS.md para detalles.
