      techniques: [T1059.001, T1047, T1218.007, T1569.002]
      rules: [cs-ps-encoded-cmd, cs-wmic-process, cs-msiexec-remote, cs-psexec-service]
    - name: discovery
      techniques: [T1033, T1087, T1069, T1046, T1057, T1082, T1016, T1049, T1482]
      rules: [cs-whoami-exec, cs-net-recon, cs-portscan-tool, cs-tasklist-discovery,
              cs-systeminfo-discovery, cs-netconfig-discovery, cs-netstat-discovery,
              cs-nltest-domain-trust]
    - name: persistence
      techniques: [T1053.005, T1547.001, T1136.001, T1053.003, T1098.004]
      rules: [cs-schtasks-create, cs-run-key-persistence, cs-create-local-account,
              cs-linux-cron-persistence, cs-linux-ssh-key-persistence]
    - name: privilege-escalation
      techniques: [T1548.003]
      rules: [cs-sudoers-modification]
      note: "Nueva en Fase 4-A. Antes not_covered."
    - name: defense-evasion
      techniques: [T1218.005, T1218.010, T1218.011, T1218.001, T1218.009,
                   T1562.001, T1070.001, T1070.002, T1197]
      rules: [cs-mshta-exec, cs-regsvr32-exec, cs-rundll32-exec, cs-hh-exec,
              cs-regasm-regsvcs, cs-disable-defender, cs-clear-eventlogs,
              cs-linux-clear-logs, cs-bitsadmin-download]
    - name: command-and-control
      techniques: [T1105, T1071, T1071.004, T1090]
      rules: [cs-certutil-download, cs-c2-port-connect, cs-dns-tunneling,
              cs-anonymization-proxy-port]
    - name: exfiltration
      techniques: [T1048]
      rules: [cs-large-outbound]
    - name: lateral-movement
      techniques: [T1021.001]
      rules: [cs-rdp-lateral]
    - name: credential-access
      techniques: [T1110, T1110.003, T1003.001]
      rules: [cs-auth-failure, cs-auth-failure-external, cs-lsass-dump]
    - name: impact
      techniques: [T1490, T1489]
      rules: [cs-inhibit-system-recovery, cs-service-stop-security]
      note: "Nueva en Fase 4-A. Antes not_covered."

  not_covered_tactics:
    - initial-access
    - collection
    - resource-development
  reason: >-
    Las tácticas no cubiertas requieren telemetría ausente en SecurityEvent:
    phishing (Initial Access → file metadata, email headers, archivo adjunto),
    clipboard/screen capture (Collection → OS API calls),
    resource-development (infraestructura del adversario, no visible desde
    dentro de la red monitoreada). Ver docs/SIGMA-EXCLUSIONS.md para detalles.
    privilege-escalation e impact se cerraron en Fase 4-A.

  metricas_fase4a:
    reglas_antes: 15
    reglas_despues: 38
    reglas_propias_mas_sigma: 45              # 7 config/rules + 38 pySigma
    tecnicas_distintas_antes: 13
    tecnicas_distintas_despues: 41
    tactics_antes: 8
    tactics_despues: 10
    cobertura_matriz_222_antes: "7/222 (3.2%)"   # solo config/rules, en producción real
    cobertura_matriz_222_despues: "41/222 (18.5%)"  # convención de navigator.py: cuenta IDs tal cual (incluye sub-técnicas)
    cobertura_tecnicas_base_despues: "29/222 (13.1%)"  # misma cifra contando solo técnica base, sin sub-técnica
    nota_honesta: >-
      El objetivo del prompt (30%+) no se alcanza contando solo técnicas base
      (13.1%) ni con la convención del proyecto que cuenta sub-técnicas por
      separado (18.5%). El techo real depende del campo disponible en
      SecurityEvent, no del número de reglas: la mayoría de técnicas restantes
      (cloud, contenedores, móvil, ICS, criptografía, hardware) no producen
      ningún dato que los 4 collectors actuales puedan capturar. Ver
      docs/AGENT-CAPABILITIES.md, seccion Bloque A, para el detalle y la
      recomendación de qué requeriría un collector nuevo (no solo una regla).
    evidencia: [docs/navigator_phase4a_before.json, docs/navigator_phase4a_after.json]
