id: RULE-0003
title: Creacion de tarea programada (posible persistencia)
description: Uso de schtasks para crear una tarea, tecnica comun de persistencia.
severity: medium
mitre_technique: T1053
mitre_tactic: persistence
conditions:
  - field: category
    op: equals
    value: process
  - field: command_line
    op: regex
    value: "schtasks(\\.exe)?\\b.*?/create\\b"
false_positives:
  - Instaladores de software legitimo que registran tareas de actualizacion.
  - Scripts de mantenimiento programados por el propio equipo de sistemas.
references:
  - https://attack.mitre.org/techniques/T1053/005/
